name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app models guardrails tests

      - name: Typecheck (mypy)
        run: mypy app models guardrails

      - name: Ensure model artifact
        run: |
          # Prefer the committed artifacts/model.joblib so /predict works out of the box
          # and CI stays fast. Only train a small fixture model if the artifact is missing.
          if [ ! -f artifacts/model.joblib ]; then
            echo "Committed model missing; training a small CI fixture..."
            python -m models.train --n-samples 2000 --artifact artifacts/model.joblib
          else
            echo "Using committed artifacts/model.joblib"
            ls -lh artifacts/model.joblib
          fi

      - name: Pytest
        run: pytest -q
